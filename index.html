<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap Master</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- SDK oficial da Adsgram -->
  <script src="https://adsgram.ai/js/adsgram-ad.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      user-select: none;
    }
    .header {
      text-align: center;
    }
    .score-container {
      font-size: 36px;
      font-weight: 800;
      color: #ffd700;
      margin-top: 5px;
    }
    .click-area {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
    }
    .coin-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffcc00 0%, #d4af37 100%);
      border: 8px solid #fff3a0;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
      font-size: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    .coin-btn:active {
      transform: scale(0.92);
    }
    .stats {
      width: 100%;
      max-width: 320px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .energy-bar-container {
      width: 100%;
      background: #333;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 5px;
    }
    .energy-bar {
      width: 100%;
      height: 100%;
      background: #007aff;
      transition: width 0.2s;
    }
    .upgrades {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .upgrade-btn {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .upgrade-btn:active {
      opacity: 0.8;
    }
    .btn-ad {
      background: #28a745;
      border-color: #28a745;
    }
    .btn-share {
      background: #0088cc;
      border-color: #0088cc;
      grid-column: span 2;
    }
    .floating-text {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-50px); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div id="user-name" style="font-size: 14px; color: #aaa;">Jogador</div>
    <div class="score-container">⚡ <span id="score">0</span></div>
  </div>

  <div class="click-area">
    <div class="coin-btn" id="coin" onclick="tapCoin(event)">🏛️</div>
  </div>

  <div class="stats">
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <span>Energia</span>
      <span><span id="energy">100</span>/100</span>
    </div>
    <div class="energy-bar-container">
      <div class="energy-bar" id="energy-bar"></div>
    </div>
  </div>

  <div class="upgrades">
    <div class="upgrade-btn" onclick="buyMult()">
      <b>+1 p/ Clique</b><br>
      Custo: <span id="mult-cost">20</span>
    </div>
    <div class="upgrade-btn" onclick="buyAuto()">
      <b>Auto-Clicker</b><br>
      Custo: <span id="auto-cost">50</span>
    </div>
    <div class="upgrade-btn btn-ad" onclick="verAnuncio()">
      <b>🎬 +100 Energia</b><br>
      Ver Anúncio
    </div>
    <div class="upgrade-btn btn-share" onclick="convidarAmigo()">
      <b>🚀 Convidar Amigos (+500 Moedas)</b>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-name').innerText = user.first_name;
    }

    let score = parseInt(localStorage.getItem('tap_score')) || 0;
    let energy = parseInt(localStorage.getItem('tap_energy')) || 100;
    let clickPower = parseInt(localStorage.getItem('tap_power')) || 1;
    let autoClick = parseInt(localStorage.getItem('tap_auto')) || 0;

    let multCost = parseInt(localStorage.getItem('tap_mult_cost')) || 20;
    let autoCost = parseInt(localStorage.getItem('tap_auto_cost')) || 50;

    // Bloco de testes da Adsgram
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "55058" }) : null;

    function updateUI() {
      document.getElementById('score').innerText = score;
      document.getElementById('energy').innerText = energy;
      document.getElementById('energy-bar').style.width = energy + '%';
      document.getElementById('mult-cost').innerText = multCost;
      document.getElementById('auto-cost').innerText = autoCost;

      localStorage.setItem('tap_score', score);
      localStorage.setItem('tap_energy', energy);
      localStorage.setItem('tap_power', clickPower);
      localStorage.setItem('tap_auto', autoClick);
      localStorage.setItem('tap_mult_cost', multCost);
      localStorage.setItem('tap_auto_cost', autoCost);
    }

    function tapCoin(event) {
      if (energy < clickPower) return;

      score += clickPower;
      energy -= clickPower;

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      const floatEl = document.createElement('div');
      floatEl.className = 'floating-text';
      floatEl.innerText = '+' + clickPower;
      floatEl.style.left = (event.clientX - 15) + 'px';
      floatEl.style.top = (event.clientY - 30) + 'px';
      document.body.appendChild(floatEl);

      setTimeout(() => floatEl.remove(), 800);

      updateUI();
    }

    function buyMult() {
      if (score >= multCost) {
        score -= multCost;
        clickPower += 1;
        multCost = Math.floor(multCost * 1.5);
        updateUI();
      }
    }

    function buyAuto() {
      if (score >= autoCost) {
        score -= autoCost;
        autoClick += 1;
        autoCost = Math.floor(autoCost * 1.8);
        updateUI();
      }
    }

    function verAnuncio() {
      if (AdController) {
        AdController.show().then(() => {
          energy = 100;
          updateUI();
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }).catch(() => {
          // Recompensa direta em testes se fechar
          energy = 100;
          updateUI();
        });
      } else {
        energy = 100;
        updateUI();
      }
    }

    function convidarAmigo() {
      const shareUrl = `https://t.me/share/url?url=https://t.me/stp_adj_bot/app&text=Vem%20jogar%20comigo%20no%20Tap%20Master!`;
      tg.openTelegramLink(shareUrl);
    }

    setInterval(() => {
      if (autoClick > 0) score += autoClick;
      if (energy < 100) energy = Math.min(100, energy + 1);
      updateUI();
    }, 1000);

    updateUI();
  </script>
</body>
</html>
