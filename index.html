<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap Master</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- SDK oficial da Adsgram -->
  <script src="https://adsgram.ai/js/adsgram-ad.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      user-select: none;
      overflow: hidden;
    }
    .header {
      text-align: center;
    }
    .score-container {
      font-size: 38px;
      font-weight: 800;
      color: #ffd700;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }
    .click-area {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
    }
    .coin-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffcc00 0%, #d4af37 100%);
      border: 8px solid #fff3a0;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      font-size: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.1s ease;
    }
    .coin-btn:active {
      transform: scale(0.90) rotate(-3deg);
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
    }
    .stats {
      width: 100%;
      max-width: 320px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 12px;
      box-sizing: border-box;
    }
    .energy-bar-container {
      width: 100%;
      background: #333;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 5px;
    }
    .energy-bar {
      width: 100%;
      height: 100%;
      background: #007aff;
      transition: width 0.2s;
    }
    .upgrades {
      width: 100%;
      max-width: 320px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .upgrade-btn {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s;
    }
    .upgrade-btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
    .btn-ad { background: #28a745; border-color: #28a745; }
    .btn-rank { background: #ff9500; border-color: #ff9500; }
    .btn-task { background: #af52de; border-color: #af52de; }
    .btn-share { background: #0088cc; border-color: #0088cc; }
    
    .floating-text {
      position: absolute;
      font-size: 26px;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: floatUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      width: 85%;
      max-width: 320px;
      text-align: center;
    }
    .rank-list {
      margin: 15px 0;
      text-align: left;
    }
    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }
    .task-btn-action {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .close-btn {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div id="user-name" style="font-size: 14px; color: #aaa;">Jogador</div>
    <div class="score-container">⚡ <span id="score">0</span></div>
  </div>

  <div class="click-area">
    <div class="coin-btn" id="coin" onclick="tapCoin(event)">🏛️</div>
  </div>

  <div class="stats">
    <div style="display: flex; justify-content: space-between; font-size: 13px;">
      <span>Energia</span>
      <span><span id="energy">100</span>/100</span>
    </div>
    <div class="energy-bar-container">
      <div class="energy-bar" id="energy-bar"></div>
    </div>
  </div>

  <div class="upgrades">
    <div class="upgrade-btn" onclick="buyMult()">
      <b>+1 p/ Clique</b><br>
      Custo: <span id="mult-cost">20</span>
    </div>
    <div class="upgrade-btn" onclick="buyAuto()">
      <b>Auto-Clicker</b><br>
      Custo: <span id="auto-cost">50</span>
    </div>
    <div class="upgrade-btn btn-ad" onclick="verAnuncio()">
      <b>🎬 +100 Energia</b><br>
      Ver Anúncio
    </div>
    <div class="upgrade-btn btn-rank" onclick="abrirRanking()">
      <b>🏆 Ranking</b><br>
      Top Jogadores
    </div>
    <div class="upgrade-btn btn-task" onclick="abrirTarefas()">
      <b>🎁 Tarefas</b><br>
      Bónus Diário
    </div>
    <div class="upgrade-btn btn-share" onclick="convidarAmigo()">
      <b>🚀 Convidar</b><br>
      +500 Moedas
    </div>
  </div>

  <!-- Modal do Ranking -->
  <div class="modal" id="rank-modal">
    <div class="modal-content">
      <h3>🏆 Tabela de Líderes</h3>
      <div class="rank-list">
        <div class="rank-item"><span>🥇 1. Alex</span><b>15,400</b></div>
        <div class="rank-item"><span>🥈 2. Marco</span><b>8,250</b></div>
        <div class="rank-item"><span>🥉 3. Tu (<span id="my-rank-name">Jogador</span>)</span><b id="my-rank-score">0</b></div>
        <div class="rank-item"><span>4. Diogo</span><b>1,100</b></div>
      </div>
      <button class="close-btn" onclick="fecharRanking()">Fechar</button>
    </div>
  </div>

  <!-- Modal de Tarefas -->
  <div class="modal" id="task-modal">
    <div class="modal-content">
      <h3>🎁 Tarefas e Bónus</h3>
      <div class="rank-list">
        <div class="rank-item">
          <span>📅 Bónus Diário</span>
          <button class="task-btn-action" id="daily-btn" onclick="claimDaily()">+300 🪙</button>
        </div>
      </div>
      <button class="close-btn" onclick="fecharTarefas()">Fechar</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Sistema Áudio Web API integrado
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'tap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } else if (type === 'buy') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }
    }

    let userName = "Jogador";
    const user = tg.initDataUnsafe?.user;
    if (user) {
      userName = user.first_name;
      document.getElementById('user-name').innerText = userName;
      document.getElementById('my-rank-name').innerText = userName;
    }

    let score = parseInt(localStorage.getItem('tap_score')) || 0;
    let energy = parseInt(localStorage.getItem('tap_energy')) || 100;
    let clickPower = parseInt(localStorage.getItem('tap_power')) || 1;
    let autoClick = parseInt(localStorage.getItem('tap_auto')) || 0;

    let multCost = parseInt(localStorage.getItem('tap_mult_cost')) || 20;
    let autoCost = parseInt(localStorage.getItem('tap_auto_cost')) || 50;
    let lastDaily = localStorage.getItem('tap_last_daily') || "";

    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "55058" }) : null;

    function updateUI() {
      document.getElementById('score').innerText = score;
      document.getElementById('energy').innerText = energy;
      document.getElementById('energy-bar').style.width = energy + '%';
      document.getElementById('mult-cost').innerText = multCost;
      document.getElementById('auto-cost').innerText = autoCost;
      document.getElementById('my-rank-score').innerText = score;

      const today = new Date().toDateString();
      const dailyBtn = document.getElementById('daily-btn');
      if (lastDaily === today) {
        dailyBtn.innerText = "Resgatado";
        dailyBtn.style.background = "#555";
        dailyBtn.disabled = true;
      }

      localStorage.setItem('tap_score', score);
      localStorage.setItem('tap_energy', energy);
      localStorage.setItem('tap_power', clickPower);
      localStorage.setItem('tap_auto', autoClick);
      localStorage.setItem('tap_mult_cost', multCost);
      localStorage.setItem('tap_auto_cost', autoCost);
      localStorage.setItem('tap_last_daily', lastDaily);
    }

    function tapCoin(event) {
      if (energy < clickPower) return;

      score += clickPower;
      energy -= clickPower;

      playSound('tap');

      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      const floatEl = document.createElement('div');
      floatEl.className = 'floating-text';
      floatEl.innerText = '+' + clickPower;
      floatEl.style.left = (event.clientX - 15) + 'px';
      floatEl.style.top = (event.clientY - 30) + 'px';
      document.body.appendChild(floatEl);

      setTimeout(() => floatEl.remove(), 800);

      updateUI();
    }

    function buyMult() {
      if (score >= multCost) {
        score -= multCost;
        clickPower += 1;
        multCost = Math.floor(multCost * 1.5);
        playSound('buy');
        updateUI();
      }
    }

    function buyAuto() {
      if (score >= autoCost) {
        score -= autoCost;
        autoClick += 1;
        autoCost = Math.floor(autoCost * 1.8);
        playSound('buy');
        updateUI();
      }
    }

    function verAnuncio() {
      if (AdController) {
        AdController.show().then(() => {
          energy = 100;
          playSound('buy');
          updateUI();
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }).catch(() => {
          energy = 100;
          playSound('buy');
          updateUI();
        });
      } else {
        energy = 100;
        playSound('buy');
        updateUI();
      }
    }

    function convidarAmigo() {
      const shareUrl = `https://t.me/share/url?url=https://t.me/stp_adj_bot/app&text=Vem%20jogar%20comigo%20no%20Tap%20Master!`;
      tg.openTelegramLink(shareUrl);
    }

    function claimDaily() {
      const today = new Date().toDateString();
      if (lastDaily !== today) {
        score += 300;
        lastDaily = today;
        playSound('buy');
        updateUI();
        alert("Resgataste 300 moedas de Bónus Diário!");
      }
    }

    function abrirRanking() { document.getElementById('rank-modal').style.display = 'flex'; }
    function fecharRanking() { document.getElementById('rank-modal').style.display = 'none'; }
    function abrirTarefas() { document.getElementById('task-modal').style.display = 'flex'; }
    function fecharTarefas() { document.getElementById('task-modal').style.display = 'none'; }

    setInterval(() => {
      if (autoClick > 0) score += autoClick;
      if (energy < 100) energy = Math.min(100, energy + 1);
      updateUI();
    }, 1000);

    updateUI();
  </script>
</body>
</html>
